services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: carepulse
      POSTGRES_USER: carepulse
      POSTGRES_PASSWORD: carepulse_dev
    ports:
      - "5432:5432"
    volumes:
      - carepulse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carepulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://carepulse:carepulse_dev@postgres:5432/carepulse
      CAREPULSE_DEMO_MODE: "false"
      CAREPULSE_JWT_SECRET: ${CAREPULSE_JWT_SECRET:-carepulse_local_change_me}
      CAREPULSE_JWT_ISSUER: carepulse
      CAREPULSE_JWT_AUDIENCE: carepulse-api
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: ./backend
    command: ["python", "-m", "app.outbox_worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://carepulse:carepulse_dev@postgres:5432/carepulse
    depends_on:
      api:
        condition: service_healthy

volumes:
  carepulse_pg:
